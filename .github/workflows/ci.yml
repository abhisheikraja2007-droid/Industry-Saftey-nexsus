# Industrial Safety Nexus — CI/CD Pipeline
# Runs on every push/PR to main branch
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Lint & Type Check ────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd industrial-safety-nexus-main/backend
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run Ruff (linting)
        run: |
          cd industrial-safety-nexus-main/backend
          ruff check . --output-format=github

      - name: Run MyPy (type checking)
        run: |
          cd industrial-safety-nexus-main/backend
          mypy . --ignore-missing-imports --no-error-summary

      - name: Run Ruff on frontend
        run: |
          cd industrial-safety-nexus-main/frontend
          npm ci
          npx eslint src --ext .js,.jsx --format=github || true

  # ─── Unit & Integration Tests ─────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safety_user
          POSTGRES_PASSWORD: safety_pass
          POSTGRES_DB: safety_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U safety_user -d safety_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
      mosquitto:
        image: eclipse-mosquitto:2
        ports: ["1883:1883", "9001:9001"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd industrial-safety-nexus-main/backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Wait for services
        run: |
          sleep 10
          pg_isready -h localhost -p 5432 -U safety_user -d safety_db
          redis-cli -h localhost -p 6379 ping

      - name: Run database migrations
        run: |
          cd industrial-safety-nexus-main/backend
          alembic upgrade head

      - name: Start backend server
        run: |
          cd industrial-safety-nexus-main/backend
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 15
          curl -f http://localhost:8000/health || exit 1

      - name: Run E2E tests
        run: |
          cd industrial-safety-nexus-main/backend
          python -m pytest tests/test_e2e_workflow.py -v --tb=short

      - name: Run unit tests
        run: |
          cd industrial-safety-nexus-main/backend
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./industrial-safety-nexus-main/backend/coverage.xml
          fail_ci_if_error: false

  # ─── Build Docker Images ──────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./industrial-safety-nexus-main
          file: ./industrial-safety-nexus-main/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./industrial-safety-nexus-main/frontend
          file: ./industrial-safety-nexus-main/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Simulator
        id: meta-simulator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/simulator
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Simulator
        uses: docker/build-push-action@v5
        with:
          context: ./industrial-safety-nexus-main
          file: ./industrial-safety-nexus-main/simulator/Dockerfile
          push: true
          tags: ${{ steps.meta-simulator.outputs.tags }}
          labels: ${{ steps.meta-simulator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── ML Model Export & Validation ─────────────────────────────
  ml-export:
    name: ONNX Export & Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ML dependencies
        run: |
          cd industrial-safety-nexus-main
          pip install -r backend/requirements.txt
          pip install skl2onnx onnx onnxruntime

      - name: Run ONNX export
        run: |
          cd industrial-safety-nexus-main
          python scripts/export_onnx.py

      - name: Upload ONNX model artifact
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-detector-onnx
          path: industrial-safety-nexus-main/ai_models/saved/anomaly_detector.onnx
          retention-days: 30

      - name: Upload export results
        uses: actions/upload-artifact@v4
        with:
          name: onnx-export-results
          path: industrial-safety-nexus-main/onnx_export_results.json
          retention-days: 30

  # ─── Performance Benchmarks ───────────────────────────────────
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd industrial-safety-nexus-main
          pip install -r backend/requirements.txt
          pip install httpx

      - name: Start services for benchmarking
        run: |
          cd industrial-safety-nexus-main
          docker-compose up -d postgres redis mosquitto
          sleep 10

      - name: Start backend
        run: |
          cd industrial-safety-nexus-main/backend
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 20
          curl -f http://localhost:8000/health || exit 1

      - name: Run benchmarks
        run: |
          cd industrial-safety-nexus-main
          python scripts/benchmark.py

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: industrial-safety-nexus-main/benchmark_results.json
          retention-days: 30

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('industrial-safety-nexus-main/benchmark_results.json', 'utf8'));
            let comment = '## 📊 Performance Benchmark Results\n\n';
            comment += '| Component | Operation | Mean Latency | P95 Latency | Throughput |\n';
            comment += '|-----------|-----------|--------------|-------------|------------|\n';
            for (const r of results.results) {
              comment += `| ${r.name.split('(')[0].trim()} | ${r.name} | ${r.mean.toFixed(2)} ms | ${r.p95.toFixed(2)} ms | ${r.throughput_per_sec.toFixed(0)} ops/s |\n`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ─── Security Scan ────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run pip-audit on Python dependencies
        run: |
          pip install pip-audit
          cd industrial-safety-nexus-main/backend
          pip-audit -r requirements.txt --format=json --output=pip-audit.json || true

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: industrial-safety-nexus-main/backend/pip-audit.json
          retention-days: 30

  # ─── Deploy to Staging (manual approval) ──────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, ml-export, benchmark, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment..."
          # Add your staging deployment commands here
          # e.g., kubectl apply -f k8s/staging/
          # or docker-compose -f docker-compose.staging.yml up -d

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          # curl -f https://staging.yourdomain.com/health